<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32-DQjEQYWa.png"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap");

      body {
        font-family: "Roboto", sans-serif;
      }

      /* Remove the problematic transform that was causing issues */

      /* #expanded-section {
        transform: translate3d(0, -25.6rem, 0);
        z-index: 2;
      } */

      .bg-image {
        background-image: url("/assets/bg-image-daytime-Sbqz5XnX.jpg");
        position: relative;
        background-size: cover;
        background-position: center;
      }

      .bg-image::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(
          0,
          0,
          0,
          0.7
        ); /* Black overlay with 50% opacity */
        /* z-index: 1;  */
      }

      .expanded-grid {
        display: grid;
        grid-template-columns: 1fr 1px 1fr; /* Added 1px column for divider */
        grid-template-rows: 1fr 1fr;
        gap: 2rem 4rem;
        height: 100%;
      }

      .info-item {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .info-label {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #303030;
        font-weight: 400;
      }

      .info-value {
        font-size: 5.5rem;
        padding-right: 50px;
        font-weight: 700;
        color: #303030;
        line-height: 1;
      }

      .vertical-divider {
        width: 1px;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.1); /* Subtle divider */
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      #toggle-more {
        background-color: white;
        border-radius: 9999px;
        padding: 0.75rem 1.25rem 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .circle-icon {
        width: 32px;
        height: 32px;
        background-color: #303030;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      #time {
        font-size: 6rem;
      }

      .time-group {
        display: flex;
        flex-direction: column;
        /* Reduced gap between time elements */
      }

      #expanded-section {
    background-color: rgba(242, 242, 242, 0.85); /* Light gray background with 85% opacity */
    padding: 100px 8rem; /* Remove top/bottom padding to allow for centering */
    display: flex;
    align-items: center; /* Center content vertically */
    justify-content: center; /* Center content horizontally */
}

      .quote-container {
        max-width: 600px;
        margin: auto;
        z-index: 2; /* Ensure the quote container is above the background */
      }

      .time-container {
        max-width: 600px;
        margin: auto;
        z-index: 2; /* Ensure the time container is above the background */
      }

      @media (max-width: 768px) {
        .bg-image {
          background-image: url("./assets/image-hero-mobile.jpg");
        }
      }
    </style>

    <title>Frontend Mentor | Clock App</title>
    <link rel="stylesheet" crossorigin href="/assets/index-mbGBFeX3.css">
  </head>
  <body class="bg-black overflow-hidden">
    <div id="bg-image" class="bg-image h-screen w-full overflow-hidden">

      <div id="quote-container"
      class="absolute top-0 left-0 p-8 w-full md:w-2/3 lg:w-1/2 quote-container"
    >
      <div class="text-white">
        <p
          class="text-xl md:text-2xl font-light leading-relaxed mb-4"
          id="quote-generate"
        ></p>
        <p class="text-xl md:text-2xl font-medium" id="author"></p>
      </div>
    </div>
      <!-- Content Wrapper - This will move up when expanded section appears -->
      <div id="content-wrapper" class=" transition-all duration-500">
        <!-- Quote Section -->


        <!-- Time Section -->
        <div class="absolute bottom-0 left-0 p-8 w-full time-container">
          <div class="time-group w-full">
            <div class="flex items-center text-white mb-1">
              <i class="fas fa-sun mr-3 text-xl"></i>
              <p
                class="text-lg md:text-xl tracking-wider uppercase"

              >
                Good morning, it's currently
              </p>
            </div>

            <div class="flex items-baseline text-white">
              <h1
                class="text-[200px] md:text-[200px] lg:text-9xl font-bold tracking-tighter"

              >
                00:00
              </h1>
              <p class="text-3xl md:text-4xl ml-4 font-light" id="time-zone">
                BST
              </p>
            </div>

            <p
              class="text-white text-xl md:text-2xl uppercase tracking-wider mt-0 font-medium"
            >
              In <span id="city">Banjul</span>, <span id="country">The Gambia</span>
            </p>
          </div>
        </div>

        <!-- More Button -->
        <div class="absolute bottom-8 right-8 z-30">
          <button
            class="bg-white text-gray-800 rounded-full flex items-center transition-all hover:bg-opacity-100"
            id="toggle-more"
          >
            <span id="toggle-word" class="font-medium mr-2">MORE</span>
            <div class="circle-icon">
              <img src="data:image/svg+xml,%3csvg%20width='14'%20height='9'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20stroke='%23FFF'%20stroke-width='2'%20fill='none'%20d='m1%201%206%206%206-6'/%3e%3c/svg%3e" alt="" id="arrow-down">
              <img src="data:image/svg+xml,%3csvg%20width='40'%20height='40'%20xmlns='http://www.w3.org/2000/svg'%3e%3cg%20fill='none'%20fill-rule='evenodd'%3e%3ccircle%20fill='%23303030'%20cx='20'%20cy='20'%20r='20'/%3e%3cpath%20stroke='%23FFF'%20stroke-width='2'%20d='M14%2023l6-6%206%206'/%3e%3c/g%3e%3c/svg%3e" class="hidden" alt="" id="arrow-up">
            </div>
          </button>
        </div>
      </div>

      <!-- Refresh Button -->
      <div class="absolute top-8 right-8 z-20" id="refresh">
        <button
          class="text-white bg-black bg-opacity-20 p-3 rounded-full hover:bg-opacity-30 transition-all"
        >
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>

      <!-- Expanded Section - Fixed positioning at the bottom -->
      <div
        id="expanded-section"
        class="fixed bottom-0 left-0 w-full h-1/2 bg-white text-black p-8 transform translate-y-full transition-transform duration-500 z-10"
      >
      <div class="expanded-grid h-full">
        <div class="info-item">
          <p class="info-label">Current Timezone</p>
          <h2 class="info-value text-9xl" id="timezone">Europe/London</h2>
        </div>
        
        <div class="vertical-divider"></div>
        
        <div class="info-item">
          <p class="info-label">Day of the week</p>
          <h2 class="info-value text-9xl" id="day-of-week">5</h2>
        </div>
        
        <div class="info-item">
          <p class="info-label">Day of the year</p>
          <h2 class="info-value" id="day-of-year">295</h2>
        </div>
        
        <div class="info-item">
          <p class="info-label">Week number</p>
          <h2 class="info-value" id="week-number">42</h2>
        </div>
      </div>
      </div>
    </div>

      let isExpanded = false;

      toggleMore.addEventListener("click", () => {

        if (isExpanded) {
          // Show expanded section
          expandedSection.classList.remove("translate-y-full");
          expandedSection.classList.add("translate-y-0");
          
          // Move content up
          contentWrapper.style.transform = "translateY(50vh)";

        } else {

          expandedSection.classList.remove("translate-y-0");

          arrowUp.classList.add("hidden");
          
          // Move content back to original position
          contentWrapper.style.transform = "translateY(100vh)";
          

          
          
          // Update button text
          toggleWord.innerHTML = 'MORE';
          
          // Reset button position
          toggleMore.parentElement.style.transform = "translateY(0)";
        }
      });

  </body>
</html>
